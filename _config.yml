# Configurations
title:            나이츠 프론티어 3기 1wdcg 블로그
longtitle:        1wdcg 블로그
author:           임현빈
email:            hb2041001@gmail.com
description: >
  나이츠 프론티어 3기 학습과정 기록

version:          1.0
gitbook_version:  3.2.3

url:              'https://1wdcg.github.io'
baseurl:          ''
rss:              RSS

# bootstrap: use the remote theme for the site itself
remote_theme: sighingnow/jekyll-gitbook

toc:
  enabled: true
  h_min:   1
  h_max:   3

# customize the link favicon in header
favicon_path:     /assets/gitbook/images/favicon.ico

# markdown render engine
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: colorful

markdown_ext:             markdown,mkdown,mkdn,mkd,md

# Permalinks
permalink:                /:categories/:year-:month-:day-:title:output_ext

exclude:
  - _drafts

collections:
  pages:
    output: true
    permalink: /:collection/:path/
  others:
    output: true
    permalink: /:collection/:path/

ordered_collections:
  - posts
  - pages
  - others

page_width: 800px

destination:      ./_site
incremental:      false
regenerate:       true

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jemoji

categories:
  - 개발
  - CTF/Wargame
  - Bug Bounty
  - 블로그/기술문서
  - 논문/컨퍼런스
  - 공모전/자격증
